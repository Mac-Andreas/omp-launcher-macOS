[window]
; 1: window, 2: window borderless, 3: fullscreen
; On macOS via CrossOver, mode 3 (true fullscreen) does an exclusive D3D
; device mode-set that is the unstable path. The launcher pins mode 1 (a normal
; bordered window) on every launch; Alt+Enter still toggles for the session.
mode=1
maximized=0
positionX=-1
positionY=-1
; Window client size. The game renders at this size, so keep it reasonably
; large; resizing the window is remembered for the next launch.
resolutionX=1280
resolutionY=800

[game]
menuFPS=30
autoPause=1
autoResume=1
